[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interaction-foundry"
version = "0.1.0"
description = "Source-preserving interaction learning and scoped agent evaluation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
interaction-foundry-hook = "interaction_foundry.hook:main"

[project.optional-dependencies]
hub = ["huggingface-hub>=1.0,<2"]

[tool.setuptools.packages.find]
where = ["src"]

