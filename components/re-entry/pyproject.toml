[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "re-entry"
version = "0.1.0"
description = "Reverse-engineering entrypoint for agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Boden Crouch" }]
dependencies = []

[project.scripts]
reentry = "reentry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reentry"]
